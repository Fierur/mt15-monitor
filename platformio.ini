[platformio]
default_envs = esp32dev
; ./data holds the server SQLite database: never let `uploadfs` copy it into flash.
data_dir = firmware_fs

[env]
platform = platformio/espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    mikalhart/TinyGPSPlus@^1.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5
build_flags =
    -D CORE_DEBUG_LEVEL=3

[env:esp32dev]
board = esp32dev
board_build.filesystem = littlefs
; COM port changes when the USB cable moves; PlatformIO auto-detects the CH340.
; upload_port = COM4
; monitor_port = COM4

; Pin map targets the classic ESP32 only. Re-map hardware before adding C3/S3.

